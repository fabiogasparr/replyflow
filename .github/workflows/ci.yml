name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**', 'codex/**']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Application and database checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: replyflow_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d replyflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies before release
        run: npm run security:audit

      - name: Generate Prisma client
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/replyflow_test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Verify contact migration and database isolation
        run: npm run test:contacts-db
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/replyflow_test

      - name: Verify conversation migration and database isolation
        run: npm run test:conversations-db
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/replyflow_test

      - name: Verify safe DM retry migration
        run: npm run test:dm-retry-db
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/replyflow_test

      - name: Verify manual retry idempotency with Redis
        run: npm run test:dm-retry-queue
        env:
          TEST_REDIS_URL: redis://localhost:6379

      - name: Verify atomic email sign-in rate limits
        run: npm run test:auth-rate-limit-redis
        env:
          TEST_REDIS_URL: redis://localhost:6379

      - name: Verify automation operational-state migration
        run: npm run test:automation-state-db
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/replyflow_test

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/replyflow_test
          REDIS_URL: redis://localhost:6379
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: test-secret-for-ci-build
          CRON_SECRET: test-secret-for-ci-cron
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          RESEND_API_KEY: re_test
          EMAIL_FROM: "ReplyFlow <login@example.com>"
          META_GRAPH_API_VERSION: v25.0
          INSTAGRAM_APP_ID: test
          INSTAGRAM_APP_SECRET: test
          FACEBOOK_APP_SECRET: test
          WEBHOOK_VERIFY_TOKEN: test
