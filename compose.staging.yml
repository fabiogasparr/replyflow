name: replyflow-staging

x-app: &app
  image: replyflow-staging:local
  build: .
  env_file: .env.staging
  init: true
  restart: unless-stopped
  environment:
    NODE_ENV: production
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: replyflow_staging
      POSTGRES_USER: replyflow
      POSTGRES_PASSWORD: ${STAGING_DB_PASSWORD:?Execute node scripts/staging.mjs init}
    volumes:
      - staging-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U replyflow -d replyflow_staging']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes', --maxmemory-policy, noeviction]
    volumes:
      - staging-redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - '127.0.0.1:8026:8025'

  migrate:
    image: replyflow-staging:local
    build: .
    env_file: .env.staging
    command: [npm, run, db:migrate]
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy

  web:
    <<: *app
    ports:
      - '127.0.0.1:3100:3000'
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:3000/api/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  worker:
    <<: *app
    command: [npm, run, worker]

  cron:
    <<: *app
    command: [sh, scripts/cron.sh]
    environment:
      CRON_BASE_URL: http://web:3000
    depends_on:
      web:
        condition: service_healthy

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [public]
    restart: unless-stopped
    command: [tunnel, --no-autoupdate, --protocol, http2, --url, 'http://web:3000']
    depends_on:
      web:
        condition: service_healthy

volumes:
  staging-postgres:
  staging-redis:
